# ──────────────────────────────────────────────────────────────────────
# PR live preview
#
# Comment "@expo-bot preview [minutes] [ios|android] [device]" on a pull
# request and this workflow boots a cloud iOS simulator or Android
# emulator running that PR's app, then comments a browser link on the PR
# so anyone can drive it. Examples:
#
#   @expo-bot preview                     iOS, runner default device, 30 min
#   @expo-bot preview 45                  45-minute session
#   @expo-bot preview iPhone 16 Pro       a specific iOS Simulator device
#   @expo-bot preview iPhone 16 Pro for 45
#   @expo-bot preview android pixel_7     an Android AVD hardware profile
#
#   1. fingerprint: hash the PR's native code
#   2. get-build:   find a fingerprint-matched binary for the platform
#   3. build:       or build one when the native code changed
#   4. repack:      inject the PR's JS into the found binary
#   5. session:     boot the device, comment the preview link
#
# Only the jobs for the chosen platform run; the other platform's jobs
# are skipped. The device name goes straight to `eas simulator:start
# --device`. The runner does not reject an unknown name, so the PR
# comment reports the *requested* device and the booted one when
# agent-device can read it.
#
# Dispatched by .github/workflows/expo-bot-bridge.yml, which checks out
# the PR head first, so every job here sees the PR's code. Run manually:
#   eas workflow:run pr-live-preview.yml -F pr_number=<N> \
#     -F platform=ios -F device="iPhone 16 Pro"
#
# Env vars required (EAS environment variables, production environment):
#   EXPO_TOKEN_SIMULATOR   personal access token (simulator is actor-gated)
#   GITHUB_TOKEN           GitHub token with pull-request write access
# GH_REPO (owner/repo) is read from package.json "repository"; an EAS env var
# named GH_REPO overrides it.
# ──────────────────────────────────────────────────────────────────────
name: PR live preview

# A new "@expo-bot preview" on the same PR replaces the run in progress.
# Note: cancellation does not stop an already-booted simulator session;
# sessions always end at their max duration.
concurrency:
  group: ${{ workflow.filename }}-pr-${{ inputs.pr_number }}
  cancel_in_progress: true

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: The pull request number to preview
        type: string
        required: true
      # String, not number: `eas workflow:run --input` sends every value as
      # a string, and the API rejects a string for a number-typed input.
      duration_minutes:
        description: Minutes before the simulator session auto-stops
        type: string
        default: "30"
      # String, not choice, for the same reason.
      platform:
        description: ios or android
        type: string
        default: ios
      device:
        description: >-
          Virtual device for the session. iOS: a Simulator device name, e.g.
          "iPhone 16 Pro". Android: an AVD hardware profile id, e.g. "pixel_7".
          Empty picks the runner's default.
        type: string
        default: ""

jobs:
  fingerprint:
    name: 1. Fingerprint native code
    type: fingerprint
    environment: preview

  # ── iOS ──────────────────────────────────────────────────────────────
  get_ios_build:
    name: 2. Find matching iOS simulator build
    type: get-build
    needs: [fingerprint]
    if: ${{ (inputs.platform || 'ios') == 'ios' }}
    params:
      platform: ios
      profile: preview
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    name: 3. Build iOS simulator (native changed)
    type: build
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    params:
      platform: ios
      profile: preview
      message: PR ${{ inputs.pr_number }} live preview

  # A found binary carries the JS it was built with; repack swaps in the
  # PR's JS. A fresh build (above) already has it, so no repack then.
  repack_ios:
    name: 4. Repack iOS with the PR's JS
    type: repack
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    params:
      build_id: ${{ needs.get_ios_build.outputs.build_id }}
      # Explicit profile: workflow:validate crashes when repack omits it.
      profile: preview
      message: PR ${{ inputs.pr_number }} live preview repack

  # ── Android ──────────────────────────────────────────────────────────
  get_android_build:
    name: 2. Find matching Android build
    type: get-build
    needs: [fingerprint]
    if: ${{ inputs.platform == 'android' }}
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_android:
    name: 3. Build Android (native changed)
    type: build
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    params:
      platform: android
      profile: preview
      message: PR ${{ inputs.pr_number }} live preview

  repack_android:
    name: 4. Repack Android with the PR's JS
    type: repack
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    params:
      build_id: ${{ needs.get_android_build.outputs.build_id }}
      profile: preview
      message: PR ${{ inputs.pr_number }} live preview repack

  # ── Session ──────────────────────────────────────────────────────────
  session:
    name: 5. Boot an Expo Simulator, comment link
    # `after`, not `needs`, on the platform jobs: the other platform's
    # jobs are skipped, and a skipped `needs` entry would skip this job.
    needs: [fingerprint]
    after: [build_ios, repack_ios, build_android, repack_android]
    environment: production
    # Expression interpolation only works in job-level env, not step-level.
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id || after.build_android.outputs.build_id || after.repack_android.outputs.build_id }}
      IOS_BUILD_STATUS: ${{ after.build_ios.status }}
      IOS_REPACK_STATUS: ${{ after.repack_ios.status }}
      ANDROID_BUILD_STATUS: ${{ after.build_android.status }}
      ANDROID_REPACK_STATUS: ${{ after.repack_android.status }}
      PLATFORM: ${{ inputs.platform || 'ios' }}
      DEVICE: ${{ inputs.device }}
      DURATION_MINUTES: ${{ inputs.duration_minutes || 30 }}
      PR_NUMBER: ${{ inputs.pr_number }}
    outputs:
      preview_url: ${{ steps.session.outputs.preview_url }}
      session_id: ${{ steps.session.outputs.session_id }}
      device_label: ${{ steps.session.outputs.device_label }}
    steps:
      - uses: eas/checkout
      # app.config.ts imports from expo/config; eas-cli can't read the
      # project config until node_modules exist.
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - id: session
        name: Start session and comment on the PR
        run: |
          set -euo pipefail
          # A numeric test catches every uninterpolated form.
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number input not interpolated; cannot continue."
            exit 1
          fi
          bash scripts/agent/pr-live-preview.sh

  preview_link:
    name: 6. Preview link
    type: doc
    needs: [session]
    params:
      md: |
        # 📱 PR #${{ inputs.pr_number }} live preview is ready

        **[Open the ${{ needs.session.outputs.device_label }} in your browser](${{ needs.session.outputs.preview_url }})**

        The link was also posted as a comment on the PR. The session stops by
        itself after ${{ inputs.duration_minutes || 30 }} minutes, or stop it
        early with:

        ```
        eas simulator:stop --id ${{ needs.session.outputs.session_id }}
        ```

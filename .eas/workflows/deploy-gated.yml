# ──────────────────────────────────────────────────────────────────────
# Gated OTA deploy (AI-verified)
#
# The agent-device variant of the simulator verification: the other
# agents drive an `argent` session, and this one keeps the `agent-device`
# session type on purpose, to show it. Mobile-CD demo: publish the OTA
# bundle to preview, let an AI agent read the diff that's shipping
# (current source vs the last production update), derive what to test,
# and verify it live on an Expo Simulator running the fingerprint-matched
# binary. Only a PASS verdict promotes the same update group to production.
#
#   1. fingerprint: hash the native code
#   2. get-build:   find a fingerprint-matched preview simulator binary
#   3. halt:        or stop here — a new fingerprint is not OTA-safe
#   4. publish:     publish the update to preview
#   5. verify:      boot the simulator, pull the update, run the AI gate
#   6. promote:     republish the same update group to production
#   7. blocked:     or a note when the gate failed
#   8. report:      the release report
#
# Verification runs on iOS only; the Android update ships in the same group
# unverified. Run:
#   eas workflow:run deploy-gated.yml [-F test_focus="..."] [-F keep_preview=true]
# Env vars required (EAS environment variables, production environment):
#   EXPO_TOKEN_SIMULATOR      personal access token (simulator is actor-gated)
#   agent credentials        the runner's variables (scripts/agent/runners/)
# Agent instructions live in .eas/deploy-gate-prompt.md and the shared
# helpers in scripts/agent/comment-lib.sh (EAS caps workflow YAML at 16 kB).
# ──────────────────────────────────────────────────────────────────────
name: Gated OTA deploy (AI-verified)

on:
  workflow_dispatch:
    inputs:
      expected_text:
        type: string
        description: "Deterministic floor: text that must be on the home screen before the AI gate runs (set empty to skip)"
        default: "Add a task"
      test_focus:
        type: string
        description: "Optional guidance for the AI verifier about what to scrutinize"
        default: ""
      duration_minutes:
        type: number
        description: "Max minutes for the verification simulator session (hard backstop; the session is stopped early once the verdict is in unless keep_preview is set)"
        default: 30
      keep_preview:
        type: string
        description: "Set to true to keep the simulator session alive after the verdict so the preview URL in the report stays watchable (bills until duration_minutes). Note: must be a string input — EAS rejects boolean inputs interpolated into env."
        default: "false"

jobs:
  fingerprint:
    name: 1. Fingerprint native code
    type: fingerprint
    environment: preview

  get_build:
    name: 2. Find fingerprint-matched binary
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: preview
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  halt_native_changed:
    name: 3. Halted — native changed
    type: doc
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    params:
      md: |
        # 🛑 OTA release halted

        The native fingerprint matches no existing preview binary — this change
        is **not OTA-safe**. Nothing was published; run a preview build first
        or use the binary release lane.

  publish_preview:
    name: 4. Publish update to preview
    type: update
    environment: preview
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    params:
      channel: preview
      message: "Gated deploy candidate"

  verify_on_simulator:
    name: 5. AI release gate on an Expo Simulator
    needs: [get_build, publish_preview]
    env:
      BUILD_ID: ${{ needs.get_build.outputs.build_id }}
      EXPECTED_TEXT: ${{ inputs.expected_text || 'Add a task' }}
      TEST_FOCUS: ${{ inputs.test_focus }}
      DURATION_MINUTES: ${{ inputs.duration_minutes || 30 }}
      KEEP_PREVIEW: ${{ inputs.keep_preview }}
    outputs:
      preview_url: ${{ steps.boot.outputs.preview_url }}
      session_id: ${{ steps.boot.outputs.session_id }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules

      - id: diff
        name: Compute the diff shipping in this release
        run: |
          set -euo pipefail
          . scripts/agent/comment-lib.sh   # eas (pinned), cap_diff

          DIFF=/tmp/release-diff.patch
          NOTE=/tmp/release-diff-note.txt

          # Baseline = the commit of the newest update on the production
          # branch: the diff against it is exactly what users will get that
          # they don't have now. Regex-parse instead of assuming JSON shape.
          BASE=$(eas update:list --branch production --limit 1 --json --non-interactive 2>/dev/null | node -e "
            let d = '';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              const m = d.match(/\"gitCommitHash\"\s*:\s*\"([0-9a-f]{7,40})\"/);
              console.log(m ? m[1] : '');
            });
          " || true)

          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "Checkout has no git metadata — source diff unavailable." | tee "$NOTE"
            echo "(source diff unavailable)" > "$DIFF"
            exit 0
          fi

          if [ -n "$BASE" ]; then
            # The checkout may be shallow; try to pull just the baseline commit.
            git cat-file -e "$BASE^{commit}" 2>/dev/null \
              || git fetch --depth=1 origin "$BASE" >/dev/null 2>&1 \
              || true
          fi

          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # Two-dot tree diff, deliberately: "what production runs now" vs
            # "what this release ships" (no merge-base needed on shallow clones).
            git diff "$BASE" HEAD > "$DIFF"
            echo "Diff of last production update commit ($BASE) vs current source (full diff of what this OTA release changes for users)." > "$NOTE"
          else
            [ -n "$BASE" ] \
              && echo "Baseline commit $BASE is not reachable in this checkout; falling back to recent commit history." > "$NOTE" \
              || echo "No previous production update with a git commit found (first gated release?); falling back to recent commit history." > "$NOTE"
            git log -5 --stat > "$DIFF" 2>/dev/null || echo "(source diff unavailable)" > "$DIFF"
          fi

          # Keep the diff within the prompt budget (cap_diff, 150 kB); a
          # capped diff keeps its full stats at the end.
          if [ "$(wc -c < "$DIFF")" -gt 150000 ]; then
            cap_diff "$DIFF"
            printf '[full stats:]\n' >> "$DIFF"
            git diff --stat "$BASE" HEAD >> "$DIFF" 2>/dev/null || true
          fi

          cat "$NOTE"
          echo "Diff size: $(wc -c < "$DIFF") bytes"

      - id: boot
        name: Boot simulator, install binary, pull update
        run: |
          set -euo pipefail
          . scripts/agent/comment-lib.sh   # eas, use_simulator_token, wait_for_session, json_field

          # The worker's auto-injected EXPO_TOKEN cannot create simulator
          # sessions; device-run sessions are also actor-gated, so this must be
          # a personal access token, not a robot token.
          use_simulator_token

          APP_ID=$(app_id)
          echo "Verifying binary $BUILD_ID + freshly published preview update"
          # --build-id installs and launches the binary before the session
          # is ready — no artifact download or manual install/launch.
          eas simulator:start --platform ios --type agent-device \
            --build-id "$BUILD_ID" \
            --max-duration-minutes "$DURATION_MINUTES" --non-interactive

          # A failure past this point must not leave the session billing idle.
          trap '[ $? -ne 0 ] && eas simulator:stop --non-interactive || true' EXIT

          wait_for_session

          # The binary is already installed and launched (simulator:start
          # --build-id), and that first cold launch checks the preview
          # channel: with fallbackToCacheTimeout 15000 it applies the new
          # update immediately if it downloads within 15s. The relaunch
          # below covers the slow case, where launch 1 falls back to cache
          # and applies the update on the next launch.
          sleep 25
          eas simulator:exec npx --yes agent-device@latest \
            close "$APP_ID" --platform ios || true
          sleep 3
          eas simulator:exec npx --yes agent-device@latest \
            open "$APP_ID" --platform ios --session default
          sleep 10

          # Deterministic floor beneath the AI gate: the app rendered a home
          # screen at all (and the expected text, if configured). Keeps the
          # gate meaningful even if the AI layer is down.
          SNAPSHOT=$(eas simulator:exec npx --yes agent-device@latest \
            snapshot -i --session default --platform ios)
          echo "$SNAPSHOT" | tee /tmp/home-snapshot.txt
          if [ -z "$SNAPSHOT" ]; then
            echo "❌ RELEASE GATE FAILED: empty UI snapshot after launch."
            exit 1
          fi
          if [ -n "$EXPECTED_TEXT" ] && ! echo "$SNAPSHOT" | grep -qF "$EXPECTED_TEXT"; then
            echo "❌ RELEASE GATE FAILED: floor text '$EXPECTED_TEXT' not found on home screen."
            exit 1
          fi
          echo "✅ Floor check passed — handing over to the AI gate."

          SESSION_JSON=$(eas simulator:get --json --non-interactive)
          PREVIEW_URL=$(echo "$SESSION_JSON" | json_field remoteConfig.webPreviewUrl)
          SESSION_ID=$(echo "$SESSION_JSON" | json_field id)
          set-output preview_url "$PREVIEW_URL"
          set-output session_id "$SESSION_ID"

      - id: gate
        name: AI release gate — derive checks from the diff and run them
        run: |
          set -euo pipefail
          . scripts/agent/comment-lib.sh   # eas, use_agent_token, use_simulator_token, normalize_verdict

          # The agent runner's credentials, as EAS environment variables
          # alongside EXPO_TOKEN_SIMULATOR (scripts/agent/run-agent.sh).
          use_agent_token
          use_simulator_token optional

          # On unexpected failure, stop the session — unless keep_preview wants
          # it alive for live inspection of the failed state.
          trap '[ $? -ne 0 ] && [ "${KEEP_PREVIEW:-false}" != "true" ] && eas simulator:stop --non-interactive || true' EXIT

          # The gate prompt lives in the repo (YAML has a 16 kB server limit).
          if [ ! -f .eas/deploy-gate-prompt.md ]; then
            echo "Missing .eas/deploy-gate-prompt.md in the checkout — cannot run the AI gate."
            exit 1
          fi
          # The agent runs eas-cli itself, so the prompt (and the allowed
          # command below) carry the pinned version from comment-lib.sh.
          sed "s/<eas-cli-version>/${EAS_CLI_VERSION}/g" .eas/deploy-gate-prompt.md > /tmp/gate-prompt.md
          printf '\nThe app id (<app-id>) is: %s\n' "$(app_id)" >> /tmp/gate-prompt.md

          if [ -n "${TEST_FOCUS:-}" ]; then
            printf '\nOperator guidance for this run: %s\n' "$TEST_FOCUS" >> /tmp/gate-prompt.md
          fi

          echo "Running the release gate agent..."
          # The verdict file is the contract; the agent's exit code is not the
          # gate. The timeout is the hard backstop: a hung agent is killed,
          # leaves no verdict, and the gate fails closed.
          bash scripts/agent/run-agent.sh run --prompt-file /tmp/gate-prompt.md \
            --profile gate --max-turns 120 --timeout 20m

          if [ ! -s /tmp/gate-verdict.md ]; then
            echo "FAIL: verifier produced no verdict file (agent error, timeout, or runaway)." > /tmp/gate-verdict.md
          fi

          echo "================ AI GATE VERDICT ================"
          cat /tmp/gate-verdict.md
          echo "================================================="

          # Stop the simulator as soon as the verdict is in — it bills until
          # stopped. Pass keep_preview=true to keep it up for the preview URL.
          if [ "${KEEP_PREVIEW:-false}" != "true" ]; then
            eas simulator:stop --non-interactive || true
            echo "Simulator session stopped (run with -F keep_preview=true to keep it watchable)."
          fi

          # normalize_verdict: "PASS: FAIL: ..." is a FAIL (comment-lib.sh).
          VERDICT_LINE=$(normalize_verdict "$(head -n 1 /tmp/gate-verdict.md)")
          set-output verdict "$VERDICT_LINE"
          case "$VERDICT_LINE" in
            PASS*) echo "✅ AI release gate passed." ;;
            *) echo "❌ AI RELEASE GATE FAILED — update stays on preview."; exit 1 ;;
          esac

  promote:
    name: 6. Promote update to production
    needs: [publish_preview, verify_on_simulator]
    env:
      UPDATE_GROUP_ID: ${{ needs.publish_preview.outputs.first_update_group_id }}
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - name: Republish verified update group to production
        run: |
          set -euo pipefail
          . scripts/agent/comment-lib.sh   # eas, use_simulator_token
          use_simulator_token optional
          echo "Promoting update group $UPDATE_GROUP_ID to production (byte-identical republish)"
          eas update:republish \
            --group "$UPDATE_GROUP_ID" \
            --destination-channel production \
            -m "Promoted by gated deploy after AI verification" \
            --non-interactive

  blocked:
    name: 7. Release blocked
    type: doc
    after: [verify_on_simulator]
    if: ${{ after.verify_on_simulator.status == 'failure' }}
    params:
      md: |
        # 🚫 Release blocked by the simulator gate

        The update reached **preview only**; verification failed, so production
        was **not** touched and users are unaffected. See the "AI release gate"
        step logs for the agent's verdict (or the "Boot simulator" logs if the run
        failed earlier).

  report:
    name: 8. Release report
    type: doc
    needs: [promote, verify_on_simulator]
    params:
      md: |
        # ✅ Release shipped through the AI gate

        > ${{ needs.verify_on_simulator.outputs.verdict }}

        1. The OTA bundle was published to **preview**.
        2. An Expo Simulator installed the fingerprint-matched binary and pulled
           that exact update over the air.
        3. The agent derived checks from the release diff and verified them on the
           device — full narrative in the "AI release gate" step logs.
        4. The **same update group** was republished to **production** —
           byte-identical, no rebuild.

        **[Watch the verification simulator](${{ needs.verify_on_simulator.outputs.preview_url }})**
        (only live when the run was started with `-F keep_preview=true`; it then
        auto-stops after the configured duration, or stop it now:)

        ```
        eas simulator:stop --id ${{ needs.verify_on_simulator.outputs.session_id }}
        ```

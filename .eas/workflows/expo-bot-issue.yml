# ──────────────────────────────────────────────────────────────────────
# Expo bot issue triage
#
# Comment "@expo-bot" on a GitHub issue and this workflow:
#
#   1. build:    find a fingerprint-matched simulator binary (or build one)
#   2. repack:   inject the base branch's JS into it (nothing is published
#                to a shared channel, so parallel triages never collide)
#   3. validate: an agent tries to replicate the issue on an Expo Simulator
#   4. evidence: screenshots go to EAS Hosting at alias issue-N-evidence
#   5. outcome:  replicated     -> a fix agent opens a PR (expo-bot/issue-N)
#                confirmed      -> (feature request) same, implementing it
#                not replicated -> reasoning is commented on the issue
#      Either way the issue gets a comment with the evidence site link.
#   6. verify:   expo-bot-verify.yml is dispatched on the new PR (default;
#                pass auto_verify=false to skip), so a phone screenshot or
#                an @expo-bot comment ends as a verified PR with no human
#                step: code review, a second Expo Simulator, evidence, and
#                the update channel to surf to all land on the PR
#
# Dispatched by .github/workflows/expo-bot-bridge.yml from a base-branch
# checkout, and by testflight-feedback.yml / testflight-crash.yml. Run
# manually:
#   eas workflow:run expo-bot-issue.yml -F issue_number=<N>
#
# Env vars required (EAS environment variables, production environment):
#   EXPO_TOKEN_SIMULATOR      personal access token (simulator is actor-gated)
#   agent credentials        the runner's variables (scripts/agent/runners/)
#   GITHUB_TOKEN              GitHub token with issues + contents + PR write
#                             (contents write is new vs the PR verify flow:
#                             the fix agent pushes the expo-bot/issue-N branch)
# GH_REPO (owner/repo) is read from package.json "repository"; an EAS env var
# named GH_REPO overrides it.
# Agent prompts live in repo files (EAS caps workflow YAML at 16 kB):
#   .eas/expo-bot-issue-prompt.md, .eas/expo-bot-fix-prompt.md, scripts/agent/*
# ──────────────────────────────────────────────────────────────────────
name: Expo bot issue triage

# A new @expo-bot comment on the same issue replaces the run in progress.
concurrency:
  group: ${{ workflow.filename }}-issue-${{ inputs.issue_number }}
  cancel_in_progress: true

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: The issue number to replicate and triage
        type: string
        required: true
      instruction:
        description: Optional guidance (text after @expo-bot in the comment)
        type: string
        default: ""
      base_branch:
        description: Branch the issue is validated against; also the fix PR base
        type: string
        default: main
      auto_verify:
        description: '"false" to skip dispatching expo-bot-verify on the fix PR (string: EAS rejects boolean inputs interpolated into env)'
        type: string
        default: "true"

jobs:
  fingerprint:
    name: 1. Fingerprint native code
    type: fingerprint
    environment: preview

  get_build:
    name: 2. Find matching simulator build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: preview
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build:
    name: 3. Build iOS simulator (native changed)
    type: build
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    params:
      platform: ios
      profile: preview
      message: Issue ${{ inputs.issue_number }} expo-bot triage

  # A found binary carries the JS it was built with; repack swaps in the
  # base branch's JS. A fresh build (above) already has it, so no repack then.
  repack:
    name: 4. Repack with the base branch's JS
    type: repack
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build.outputs.build_id }}
      # Explicit profile: workflow:validate crashes when repack omits it.
      profile: preview
      message: Issue ${{ inputs.issue_number }} expo-bot triage

  validate:
    name: 5. Replicate on an Expo Simulator
    needs: [get_build]
    after: [build, repack]
    environment: production
    env:
      BUILD_ID: ${{ after.build.outputs.build_id || after.repack.outputs.build_id }}
      BUILD_STATUS: ${{ after.build.status }}
      REPACK_STATUS: ${{ after.repack.status }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      INSTRUCTION: ${{ inputs.instruction }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      AUTO_VERIFY: ${{ inputs.auto_verify }}
    outputs:
      evidence_url: ${{ steps.validate.outputs.evidence_url }}
      verdict: ${{ steps.validate.outputs.verdict }}
      verdict_shown: ${{ steps.validate.outputs.verdict_shown }}
      pr_url: ${{ steps.validate.outputs.pr_url }}
      verify_run_url: ${{ steps.validate.outputs.verify_run_url }}
    steps:
      - uses: eas/checkout
      # app.config.ts imports from expo/config; eas-cli can't read the
      # project config until node_modules exist.
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - id: validate
        name: Replicate, collect evidence, fix or explain
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "issue_number input not interpolated; cannot continue."
            exit 1
          fi
          bash scripts/agent/validate-issue.sh

  blocked:
    name: 6. Triage failed
    type: doc
    after: [validate]
    if: ${{ after.validate.status == 'failure' }}
    params:
      md: |
        # 🚫 Issue triage did not complete

        The run failed before a clean verdict and evidence publish. A status
        comment was posted on the issue; details are in the
        "5. Replicate on an Expo Simulator" job logs.

  report:
    name: 6. Triage report
    type: doc
    needs: [validate]
    params:
      md: |
        # 🤖 Expo bot triage for issue #${{ inputs.issue_number }}

        > ${{ needs.validate.outputs.verdict_shown }}

        - 🔧 **Fix PR**: ${{ needs.validate.outputs.pr_url }}
        - 🧪 **Verification run** (review + a second Expo Simulator; lands on the PR): ${{ needs.validate.outputs.verify_run_url }}
        - 🖼️ **[Evidence site](${{ needs.validate.outputs.evidence_url }})**: screenshots from the simulator run

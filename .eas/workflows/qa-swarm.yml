# ──────────────────────────────────────────────────────────────────────
# QA swarm
#
# Five agentic QA lanes run AT ONCE, each on its own Expo Simulator:
#
#   1. fingerprint: hash the native code for both platforms
#   2. get-build:   find fingerprint-matched preview binaries (iOS sim, Android)
#   3. build:       or build one when the native code changed
#   4. repack:      inject this checkout's JS into each found binary — no
#                   shared update channel, so PR runs never touch `preview`
#   5. swarm:       3 iOS simulators (tasks, add, done) + 2 Android
#                   emulators (tasks, add), each driven by a headless
#                   coding agent; a lane's job status IS its QA verdict
#   6. stitch:      per-lane verdicts, timings (parallel vs serial wall
#                   clock, device commands, device-minutes), evidence sites
#                   at qa-<platform>-<flow>-evidence; with pr_number, one
#                   PR comment with a thumbnail row
#   7. report:      the same summary as the run's report doc
#
# Deliberately not covered: the Admin tab (channel surfing would reload
# the app out from under the agent).
#
# Run it (manual only; the @expo-bot bridge does not dispatch it):
#   eas workflow:run .eas/workflows/qa-swarm.yml [-F pr_number=<n>]
#
# Env vars required (EAS environment variables, production environment):
#   EXPO_TOKEN_SIMULATOR      optional personal access token; used first when set
#   agent credentials        the runner's variables (scripts/agent/runners/)
#   GITHUB_TOKEN              PR comment (pr_number runs only)
# GH_REPO (owner/repo) is read from package.json "repository"; an EAS env var
# named GH_REPO overrides it.
# Agent prompts live in repo files (EAS caps workflow YAML at 16 kB):
#   .eas/qa-swarm-prompt.md, .eas/qa-flows/* (a <flow>.<platform>.md file
#   overrides <flow>.md for one platform), scripts/agent/qa-flow.sh,
#   scripts/agent/qa-swarm-report.sh
# ──────────────────────────────────────────────────────────────────────
name: QA swarm

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to report on (empty = dashboard report only)
        type: string
        default: ""

concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  fingerprint:
    name: 1. Fingerprint native code
    type: fingerprint
    environment: preview

  get_ios_build:
    name: 2. Find iOS simulator build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: preview
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  get_android_build:
    name: 2. Find Android build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    name: 3. Build iOS simulator (native changed)
    type: build
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    params:
      platform: ios
      profile: preview
      message: QA swarm

  build_android:
    name: 3. Build Android (native changed)
    type: build
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    params:
      platform: android
      profile: preview
      message: QA swarm

  # A found binary carries the JS it was built with; repack swaps in this
  # checkout's JS. A fresh build already has it, so no repack then.
  repack_ios:
    name: 4. Repack iOS with this JS
    type: repack
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    params:
      build_id: ${{ needs.get_ios_build.outputs.build_id }}
      # Explicit profile: workflow:validate crashes when repack omits it.
      profile: preview
      message: QA swarm

  repack_android:
    name: 4. Repack Android with this JS
    type: repack
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    params:
      build_id: ${{ needs.get_android_build.outputs.build_id }}
      profile: preview
      message: QA swarm

  qa_ios_tasks:
    name: "5. Lane: iOS · Tasks"
    needs: [get_ios_build]
    after: [build_ios, repack_ios]
    environment: production
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      BUILD_STATUS: ${{ after.build_ios.status }}
      REPACK_STATUS: ${{ after.repack_ios.status }}
      PLATFORM: ios
      FLOW: tasks
      PR_NUMBER: ${{ inputs.pr_number }}
    outputs:
      verdict: ${{ steps.qa.outputs.verdict }}
      evidence_url: ${{ steps.qa.outputs.evidence_url }}
      metrics: ${{ steps.qa.outputs.metrics }}
      seconds: ${{ steps.qa.outputs.seconds }}
      sim_minutes: ${{ steps.qa.outputs.sim_minutes }}
      thumbs: ${{ steps.qa.outputs.thumbs }}
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - id: qa
        run: bash scripts/agent/qa-flow.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-tasks-evidence
          path: evidence/**/*

  qa_ios_add:
    name: "5. Lane: iOS · Add"
    needs: [get_ios_build]
    after: [build_ios, repack_ios]
    environment: production
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      BUILD_STATUS: ${{ after.build_ios.status }}
      REPACK_STATUS: ${{ after.repack_ios.status }}
      PLATFORM: ios
      FLOW: add
      PR_NUMBER: ${{ inputs.pr_number }}
    outputs:
      verdict: ${{ steps.qa.outputs.verdict }}
      evidence_url: ${{ steps.qa.outputs.evidence_url }}
      metrics: ${{ steps.qa.outputs.metrics }}
      seconds: ${{ steps.qa.outputs.seconds }}
      sim_minutes: ${{ steps.qa.outputs.sim_minutes }}
      thumbs: ${{ steps.qa.outputs.thumbs }}
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - id: qa
        run: bash scripts/agent/qa-flow.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-add-evidence
          path: evidence/**/*

  qa_ios_done:
    name: "5. Lane: iOS · Done"
    needs: [get_ios_build]
    after: [build_ios, repack_ios]
    environment: production
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      BUILD_STATUS: ${{ after.build_ios.status }}
      REPACK_STATUS: ${{ after.repack_ios.status }}
      PLATFORM: ios
      FLOW: done
      PR_NUMBER: ${{ inputs.pr_number }}
    outputs:
      verdict: ${{ steps.qa.outputs.verdict }}
      evidence_url: ${{ steps.qa.outputs.evidence_url }}
      metrics: ${{ steps.qa.outputs.metrics }}
      seconds: ${{ steps.qa.outputs.seconds }}
      sim_minutes: ${{ steps.qa.outputs.sim_minutes }}
      thumbs: ${{ steps.qa.outputs.thumbs }}
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - id: qa
        run: bash scripts/agent/qa-flow.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-done-evidence
          path: evidence/**/*

  qa_android_tasks:
    name: "5. Lane: Android · Tasks"
    needs: [get_android_build]
    after: [build_android, repack_android]
    environment: production
    env:
      BUILD_ID: ${{ after.build_android.outputs.build_id || after.repack_android.outputs.build_id }}
      BUILD_STATUS: ${{ after.build_android.status }}
      REPACK_STATUS: ${{ after.repack_android.status }}
      PLATFORM: android
      FLOW: tasks
      PR_NUMBER: ${{ inputs.pr_number }}
    outputs:
      verdict: ${{ steps.qa.outputs.verdict }}
      evidence_url: ${{ steps.qa.outputs.evidence_url }}
      metrics: ${{ steps.qa.outputs.metrics }}
      seconds: ${{ steps.qa.outputs.seconds }}
      sim_minutes: ${{ steps.qa.outputs.sim_minutes }}
      thumbs: ${{ steps.qa.outputs.thumbs }}
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - id: qa
        run: bash scripts/agent/qa-flow.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-android-tasks-evidence
          path: evidence/**/*

  qa_android_add:
    name: "5. Lane: Android · Add"
    needs: [get_android_build]
    after: [build_android, repack_android]
    environment: production
    env:
      BUILD_ID: ${{ after.build_android.outputs.build_id || after.repack_android.outputs.build_id }}
      BUILD_STATUS: ${{ after.build_android.status }}
      REPACK_STATUS: ${{ after.repack_android.status }}
      PLATFORM: android
      FLOW: add
      PR_NUMBER: ${{ inputs.pr_number }}
    outputs:
      verdict: ${{ steps.qa.outputs.verdict }}
      evidence_url: ${{ steps.qa.outputs.evidence_url }}
      metrics: ${{ steps.qa.outputs.metrics }}
      seconds: ${{ steps.qa.outputs.seconds }}
      sim_minutes: ${{ steps.qa.outputs.sim_minutes }}
      thumbs: ${{ steps.qa.outputs.thumbs }}
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - id: qa
        run: bash scripts/agent/qa-flow.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-android-add-evidence
          path: evidence/**/*

  # Runs whatever the lanes did (after, not needs): a red lane must still
  # be reported.
  summarize:
    name: 6. Stitch the swarm report
    after:
      [qa_ios_tasks, qa_ios_add, qa_ios_done, qa_android_tasks, qa_android_add]
    environment: production
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      L1_STATUS: ${{ after.qa_ios_tasks.status }}
      L1_VERDICT: ${{ after.qa_ios_tasks.outputs.verdict }}
      L1_EVIDENCE: ${{ after.qa_ios_tasks.outputs.evidence_url }}
      L1_METRICS: ${{ after.qa_ios_tasks.outputs.metrics }}
      L1_SECONDS: ${{ after.qa_ios_tasks.outputs.seconds }}
      L1_SIM_MIN: ${{ after.qa_ios_tasks.outputs.sim_minutes }}
      L1_THUMBS: ${{ after.qa_ios_tasks.outputs.thumbs }}
      L2_STATUS: ${{ after.qa_ios_add.status }}
      L2_VERDICT: ${{ after.qa_ios_add.outputs.verdict }}
      L2_EVIDENCE: ${{ after.qa_ios_add.outputs.evidence_url }}
      L2_METRICS: ${{ after.qa_ios_add.outputs.metrics }}
      L2_SECONDS: ${{ after.qa_ios_add.outputs.seconds }}
      L2_SIM_MIN: ${{ after.qa_ios_add.outputs.sim_minutes }}
      L2_THUMBS: ${{ after.qa_ios_add.outputs.thumbs }}
      L3_STATUS: ${{ after.qa_ios_done.status }}
      L3_VERDICT: ${{ after.qa_ios_done.outputs.verdict }}
      L3_EVIDENCE: ${{ after.qa_ios_done.outputs.evidence_url }}
      L3_METRICS: ${{ after.qa_ios_done.outputs.metrics }}
      L3_SECONDS: ${{ after.qa_ios_done.outputs.seconds }}
      L3_SIM_MIN: ${{ after.qa_ios_done.outputs.sim_minutes }}
      L3_THUMBS: ${{ after.qa_ios_done.outputs.thumbs }}
      L4_STATUS: ${{ after.qa_android_tasks.status }}
      L4_VERDICT: ${{ after.qa_android_tasks.outputs.verdict }}
      L4_EVIDENCE: ${{ after.qa_android_tasks.outputs.evidence_url }}
      L4_METRICS: ${{ after.qa_android_tasks.outputs.metrics }}
      L4_SECONDS: ${{ after.qa_android_tasks.outputs.seconds }}
      L4_SIM_MIN: ${{ after.qa_android_tasks.outputs.sim_minutes }}
      L4_THUMBS: ${{ after.qa_android_tasks.outputs.thumbs }}
      L5_STATUS: ${{ after.qa_android_add.status }}
      L5_VERDICT: ${{ after.qa_android_add.outputs.verdict }}
      L5_EVIDENCE: ${{ after.qa_android_add.outputs.evidence_url }}
      L5_METRICS: ${{ after.qa_android_add.outputs.metrics }}
      L5_SECONDS: ${{ after.qa_android_add.outputs.seconds }}
      L5_SIM_MIN: ${{ after.qa_android_add.outputs.sim_minutes }}
      L5_THUMBS: ${{ after.qa_android_add.outputs.thumbs }}
    outputs:
      headline: ${{ steps.report.outputs.headline }}
      timing: ${{ steps.report.outputs.timing }}
      fleet: ${{ steps.report.outputs.fleet }}
      lane_1: ${{ steps.report.outputs.lane_1 }}
      lane_2: ${{ steps.report.outputs.lane_2 }}
      lane_3: ${{ steps.report.outputs.lane_3 }}
      lane_4: ${{ steps.report.outputs.lane_4 }}
      lane_5: ${{ steps.report.outputs.lane_5 }}
    steps:
      - uses: eas/checkout
      # comment-lib.sh runs eas-simulator-evidence from node_modules.
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - id: report
        run: bash scripts/agent/qa-swarm-report.sh

  report:
    name: 7. Swarm report
    type: doc
    needs: [summarize]
    params:
      md: |
        # 🐝 QA swarm report

        > ${{ needs.summarize.outputs.headline }}

        Five agents tested the app at the same time, each on its own EAS
        Expo Simulator. A lane's job status is its QA verdict.

        - ⏱ **Parallel** — ${{ needs.summarize.outputs.timing }}
        - 📱 **Fleet** — ${{ needs.summarize.outputs.fleet }}

        ### Lanes

        - ${{ needs.summarize.outputs.lane_1 }}
        - ${{ needs.summarize.outputs.lane_2 }}
        - ${{ needs.summarize.outputs.lane_3 }}
        - ${{ needs.summarize.outputs.lane_4 }}
        - ${{ needs.summarize.outputs.lane_5 }}

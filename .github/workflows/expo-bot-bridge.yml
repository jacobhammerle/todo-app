name: Expo bot bridge

# Routes "@expo-bot" comments.
#
# On a pull request, by mode:
#   @expo-bot <instruction>          apply the change, then review + verify
#   @expo-bot change <instruction>   apply the change only — fast, no EAS run
#   @expo-bot review [instruction]   review + verify only, no code changes
#   @expo-bot preview [minutes] [ios|android] [device]
#                                    boot a cloud simulator/emulator running
#                                    the PR's app; the browser link lands on
#                                    the PR. Words in any order, e.g. "45",
#                                    "iPhone 16 Pro for 45", "android pixel_7 20m"
# A bare "@expo-bot" runs review mode. Change modes run a Claude Code
# agent here in the Action, commit to the PR branch, and push. The other
# modes dispatch an EAS workflow, which does the work and posts its own
# result on the PR.
#
# On an issue (not a PR):
#   @expo-bot [guidance]             replicate the issue on an EAS cloud
#                                    simulator; if replicated, open a fix PR
#                                    and verify it. Guidance (e.g. repro
#                                    steps) goes to the replication agent.
#
# The pieces live in scripts/agent/ so they can be read and run outside
# Actions: parse-bot-comment.sh (mode + instruction), dispatch.sh (mode ->
# EAS workflow, plus the status comment), bot-comment.sh (the comment
# shape), apply-change.sh (the change agent). This file only orders them.
#
# The `if` condition on the job is a security gate. Only the repository
# owner, organization members, and collaborators can drive the bot. Do
# not remove it. Without it, anyone who can comment could run agent
# workflows against this repository with your credentials. PRs from
# forks are refused below for the same reason.
#
# Bring your own tokens. Nothing here ships with a credential; a fork of
# this repo does nothing until its owner adds these repository secrets
# (GitHub → Settings → Secrets and variables → Actions):
#   EXPO_TOKEN                Expo access token that can run EAS workflows
#   CLAUDE_CODE_OAUTH_TOKEN   from `claude setup-token` — change modes only
#                             (ANTHROPIC_API_KEY works as a fallback)
# The EAS side (review, verify, preview, triage) reads its own
# tokens from the EAS production environment; see the README.

on:
  issue_comment:
    types: [created]

permissions:
  # Change modes push commits to the PR branch.
  contents: write
  issues: write
  # Reading /pulls/N and reacting to a PR comment both need
  # pull-request access.
  pull-requests: write

jobs:
  route:
    name: Route the @expo-bot comment
    runs-on: ubuntu-latest
    # "@expo-bot" as a whole word: followed by a space, a line break
    # (\r\n from the web UI, \n from the API), or nothing. "@expo-bottle"
    # does not match. parse-bot-comment.sh enforces the same boundary.
    # A bare "@expo-bot" or "@expo-bot <words>". parse-bot-comment.sh
    # enforces the word boundary, so "@expo-bottle" fails the job before
    # anything runs.
    if: >-
      startsWith(github.event.comment.body, '@expo-bot') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ACTOR: ${{ github.event.comment.user.login }}
      TARGET: ${{ github.event.issue.pull_request != null && 'pr' || 'issue' }}
      ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Acknowledge the comment with an eyes reaction
        run: |
          gh api "repos/${GH_REPO}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes >/dev/null || true

      - name: Look up the PR head (fork guard)
        id: pr
        if: env.TARGET == 'pr'
        run: |
          # Both the change agent and the EAS workflow run PR code with
          # this project's secrets, so refuse PRs from forks outright.
          PR_JSON=$(gh api "repos/${GH_REPO}/pulls/${ISSUE_NUMBER}")
          HEAD_REPO=$(echo "$PR_JSON" | jq -r '.head.repo.full_name')
          HEAD_BRANCH=$(echo "$PR_JSON" | jq -r '.head.ref')
          STATE=$(echo "$PR_JSON" | jq -r '.state')
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "PR head is fork '$HEAD_REPO'; refusing to run agent workflows on it."
            exit 1
          fi
          if [ "$STATE" != "open" ]; then
            echo "PR is $STATE; not running the bot on it."
            exit 1
          fi
          echo "branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      # A PR checks out its head branch (not a detached SHA): change modes
      # push to it, and `eas workflow:run` uploads this checkout so every
      # EAS job sees the PR's code. An issue checks out the default
      # branch, which is also the base for a fix PR.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.branch || github.event.repository.default_branch }}

      - name: Parse the mode and instruction
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -o pipefail
          bash scripts/agent/parse-bot-comment.sh "$COMMENT_BODY" "$TARGET" | tee -a "$GITHUB_OUTPUT"

      - name: Check the secrets this mode needs
        env:
          MODE: ${{ steps.parse.outputs.mode }}
          # A secret cannot be read in an `if`; compare it to '' here.
          HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
          HAS_MODEL_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          MISSING=""
          case "$MODE" in
            full|review|preview|issue)
              [ "$HAS_EXPO_TOKEN" = "true" ] || MISSING="EXPO_TOKEN" ;;
          esac
          case "$MODE" in
            full|change)
              [ "$HAS_MODEL_TOKEN" = "true" ] || MISSING="${MISSING:+$MISSING and }CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY)" ;;
          esac
          [ -n "$MISSING" ] || exit 0
          case "$MODE" in
            issue) COMMAND="@expo-bot" ;;
            full) COMMAND="@expo-bot <instruction>" ;;
            *) COMMAND="@expo-bot ${MODE}" ;;
          esac
          bash scripts/agent/bot-comment.sh "🤖 Expo bot" \
            "⚠️ **This repository has no \`${MISSING}\` secret**, so \`${COMMAND}\` cannot run. The bot spends only tokens you add yourself: see \"Bring your own tokens\" in the README, add the secret under Settings → Secrets and variables → Actions, then comment again."
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # app.config.ts imports from expo/config; eas-cli can't read the
      # project config (workflow:run) until node_modules exist. The
      # change agent's tsc gate needs them too.
      - name: Install dependencies
        run: npm ci

      - name: Apply the requested change to the PR branch
        if: contains(fromJSON('["full","change"]'), steps.parse.outputs.mode)
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          INSTRUCTION: ${{ steps.parse.outputs.instruction }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/agent/apply-change.sh

      # dispatch.sh posts the status comment itself, or the failure
      # comment (with a link to this run) when the dispatch does not start.
      - name: Dispatch the EAS workflow and post the status comment
        if: steps.parse.outputs.mode != 'change'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MODE: ${{ steps.parse.outputs.mode }}
          INSTRUCTION: ${{ steps.parse.outputs.instruction }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/agent/dispatch.sh
